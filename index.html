<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extraction</title>
    <script>
      // Resolves the theme before the first paint, so a viewer on dark mode never gets a
      // frame of full-brightness white while the bundle loads. It has to be inline and
      // blocking to do that, which is why this logic exists twice: the twin is
      // `resolveTheme` in src/utils/themePrefs.ts, and `extraction.theme` is THEME_KEY
      // there. test/theme.test.ts fails if the two stop agreeing on the key.
      try {
        var choice = window.localStorage.getItem("extraction.theme") || "system";
        var dark =
          choice === "dark" ||
          (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
